# CI for the Robinson GitHub MCP. Independent jobs plus one aggregate job named `ci`, the single merge gate.
# Public repository: no secrets, read-only token, never pull_request_target, never echo environment values.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # secret scan, docs check, index validation, catalog count, lint, write-safety, token budgets, core imports
      - run: npm run check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm test -- --shard=${{ matrix.shard }}/3

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Docker Official Postgres 17: ECR public mirror returned repeated 429/data-limit errors before test startup on Oct 12, 2026.
        # Preserve the same PostgreSQL major and full DB suite; this is not a test skip.
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:shapes

  rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      # Upstream Hub RTC 1 runner pinned and executed against reference + our restricted HTTP adapter.
      # A deliberately non-certified manifest remains an explicit failed probe, never a pass.
      - if: steps.scope.outputs.code == 'true'
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:rtc

  browser:
    # Real browsers (Chromium as an Android phone and desktop, WebKit as an iPhone) walk the whole sign-in and the
    # "My connection" page against the real server code, a fake GitHub and a fake app. No network service is contacted.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Documentation-only pull requests skip this job's heavy steps (the job still reports success); see scripts/ci-scope.mjs.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      # Chromium: the runner's own Google Chrome (nothing to download). WebKit: Playwright's build plus its system libraries.
      # A slow or stuck install fails after one bounded attempt and leaves its last output as an annotation.
      - name: Install the WebKit engine
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        # The runner's mirror can take over 210 s. Do not retry an apt installation killed by a timeout:
        # its surviving apt-get child holds dpkg's lock, making the next attempt fail before tests execute.
        # Give one bounded 9-minute attempt and retain the real browser suite, never skip WebKit.
        run: |
          start=$(date +%s)
          if timeout 540 npx playwright install --with-deps webkit > /tmp/pw-install.log 2>&1; then
            echo "::notice title=WebKit install::completed in $(( $(date +%s) - start )) seconds"
            exit 0
          fi
          echo "::error title=WebKit install failed::$(tail -c 900 /tmp/pw-install.log | tr '\n\r' '  ')"
          exit 1
      - if: steps.scope.outputs.code == 'true'
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:browser
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
          BROWSER_CHROMIUM_PATH: /usr/bin/google-chrome
          REQUIRE_ALL_BROWSERS: '1'

  ci:
    if: always()
    needs: [check, unit, db, shapes, rtc, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          SHAPES: ${{ needs.shapes.result }}
          RTC: ${{ needs.rtc.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          status=0
          for job in CHECK UNIT DB SHAPES RTC BROWSER; do
            result="${!job}"
            echo "$job: $result"
            [ "$result" = success ] || status=1
          done
          exit $status
